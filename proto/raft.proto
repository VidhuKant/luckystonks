syntax = "proto3";

package luckystonks;

// Raft peer RPCs (phase 2 — proto menu only for skeleton).
service Raft {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteReply);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesReply);
}

message RequestVoteRequest {
  int32 from = 1;
  int32 to = 2;
  int64 term = 3;
  int64 last_log_index = 4;
  int64 last_log_term = 5;
}

message RequestVoteReply {
  int32 from = 1;
  int32 to = 2;
  int64 term = 3;
  bool vote_granted = 4;
}

message AppendEntriesRequest {
  int32 from = 1;
  int32 to = 2;
  int64 term = 3;
  int64 prev_index = 4;
  int64 prev_term = 5;
  int64 commit_index = 6;
  repeated LogEntry entries = 7;
}

message LogEntry {
  int64 term = 1;
  bytes command = 2;
}

message AppendEntriesReply {
  int32 from = 1;
  int32 to = 2;
  int64 term = 3;
  bool entry_appended = 4;
  int64 match_index = 5;
}
