syntax = "proto3";

package luckystonks;

// Insight gRPC node in this repo (:50070). Clients call GetInsight here.
// Inference uses external vLLM OpenAI-compatible HTTP on :8000 (not in this repo).
service Insight {
  rpc GetInsight(GetInsightRequest) returns (GetInsightReply);
}

message GetInsightRequest {
  string request_id = 1;
  string query = 2;
  string context = 3;
}

message GetInsightReply {
  string request_id = 1;
  string answer = 2;
}
